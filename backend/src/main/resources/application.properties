spring.application.name=student
server.port=${PORT:8080}

# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Supports:
# 1. Full URL via SPRING_DATASOURCE_URL
# 2. Dynamic host/port/database via DB_HOST, DB_PORT, DB_NAME (injected by Render Blueprint)
# 3. Localhost fallback for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ocampo_student}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
